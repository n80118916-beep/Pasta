name: Build TusiClient Mod

on:
  push:
    branches: [ "main", "master", "1.12.2" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'

    # Эта строка больше не будет ломать сборку, если файла gradlew нет
    - name: Make gradlew executable (if exists)
      run: if [ -f ./gradlew ]; then chmod +x ./gradlew; fi

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '7.6.4' # Версия Gradle для 1.12.2

    - name: Build with Gradle
      run: gradle build # Используем системный gradle, а не ./gradlew

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: TusiClient-Jar
        path: build/libs/*.jar
